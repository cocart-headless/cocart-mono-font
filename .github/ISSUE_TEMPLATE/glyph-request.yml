name: Glyph, script or feature request
description: Ask for a character, a language, an alternate or an OpenType feature.
labels: [glyph-request]
body:
  - type: markdown
    attributes:
      value: |
        Check the **Coverage** section of the [specimen](https://cocart-headless.github.io/cocart-mono-font/) first. It counts every code point the font draws.

  - type: textarea
    id: characters
    attributes:
      label: Characters
      description: Paste them, and add code points if you know them (U+20C0).
      render: text
    validations:
      required: true

  - type: dropdown
    id: script
    attributes:
      label: Script
      multiple: true
      options:
        - Latin
        - Cyrillic
        - Greek
        - Thai
        - Armenian
        - Georgian
        - Another script
        - Symbols (box drawing, blocks, Braille, currency, agent marks)
        - OpenType feature or alternate

  - type: textarea
    id: why
    attributes:
      label: Where would you use it?
      description: A language, a store, a CLI tool, a terminal UI… Real examples help us draw it right.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: References
      description: Links or images of how the character is usually drawn, or how another monospace handles it.
