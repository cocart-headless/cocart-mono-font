name: Pages

# Builds the specimen site from site/ plus fonts/, install.sh and OFL.txt,
# and deploys it to https://cocart-headless.github.io/cocart-mono-font/
# Requires Settings › Pages › Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "fonts/**"
      - "install.sh"
      - "OFL.txt"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/configure-pages@v5

      - name: Assemble the site
        run: python scripts/build_site.py --out _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
