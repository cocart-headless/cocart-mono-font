name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fonts:
    name: Fonts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install fontTools
        run: pip install -r requirements.txt

      - name: Check font files and stylesheets
        run: python scripts/check_fonts.py

      - name: Build the release zip (dry run)
        run: python scripts/build_release.py --version 0.0.0 --out dist

      - name: Build the npm package (dry run)
        run: |
          python scripts/build_npm.py --version 0.0.0 --out dist/npm
          npm pack --dry-run ./dist/npm

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the site and check local links
        run: python scripts/build_site.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install actionlint-py==1.7.12.25 shellcheck-py==0.11.0.1

      - name: Lint workflows
        run: actionlint -color

      - name: Lint the installer
        run: shellcheck install.sh

      - name: Check the installer has LF line endings
        run: |
          if grep -q $'\r' install.sh; then
            echo "::error file=install.sh::install.sh has CRLF line endings and will not run under sh"
            exit 1
          fi

  changelog:
    name: Changelog
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Font changes need a changelog entry
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if echo "$changed" | grep -q '^fonts/' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::This PR changes files in fonts/ but not CHANGELOG.md. Add a line under 'Unreleased', or ask a maintainer for the skip-changelog label."
            exit 1
          fi
          echo "OK"
